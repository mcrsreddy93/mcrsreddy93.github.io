<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mula Chinna Ranga Swami Reddy | Majestic Presence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 30%, #0a0f1c, #020408);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Times New Roman', 'Playfair Display', 'Georgia', 'Cinema', system-ui, serif;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      cursor: default;
    }

    /* animated gradient orbs background */
    .bg-orb {
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(210, 170, 80, 0.12), rgba(0, 0, 0, 0) 70%);
      top: -20vh;
      left: -20vw;
      animation: floatOrb 22s infinite alternate ease-in-out;
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb-2 {
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(230, 190, 100, 0.1), rgba(0, 0, 0, 0) 70%);
      bottom: -15vh;
      right: -15vw;
      animation: floatOrbReverse 26s infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb-3 {
      position: absolute;
      width: 50vmax;
      height: 50vmax;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200, 160, 70, 0.08), rgba(0, 0, 0, 0) 70%);
      top: 40%;
      left: 30%;
      animation: slowSpin 32s infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.4;
      }

      100% {
        transform: translate(8%, 6%) scale(1.25);
        opacity: 0.8;
      }
    }

    @keyframes floatOrbReverse {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 0.3;
      }

      100% {
        transform: translate(-7%, -5%) scale(1.3);
        opacity: 0.7;
      }
    }

    @keyframes slowSpin {
      0% {
        transform: rotate(0deg) scale(1);
        opacity: 0.2;
      }

      100% {
        transform: rotate(12deg) scale(1.2);
        opacity: 0.5;
      }
    }

    /* Main card - luxurious, deep, with animated border pulse */
    .name-shrine {
      position: relative;
      z-index: 10;
      max-width: 1200px;
      width: 100%;
      background: rgba(10, 14, 22, 0.65);
      backdrop-filter: blur(16px);
      border-radius: 3rem;
      padding: 3rem 2rem;
      box-shadow: 0 30px 55px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.3) inset;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(212, 175, 55, 0.4);
      animation: cardGlowPulse 4s infinite alternate, floatCard 6s infinite ease-in-out;
      transform-origin: center;
    }

    @keyframes cardGlowPulse {
      0% {
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.2) inset;
        border-color: rgba(212, 175, 55, 0.3);
      }

      100% {
        box-shadow: 0 35px 65px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(230, 200, 80, 0.6) inset;
        border-color: rgba(230, 200, 80, 0.8);
      }
    }

    @keyframes floatCard {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-6px);
      }

      100% {
        transform: translateY(0px);
      }
    }

    /* main name text with multi-layered animation */
    .glory-text {
      font-size: clamp(2.3rem, 9vw, 5.6rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.25;
      background: linear-gradient(135deg, #FFF8E7 0%, #F3E3B0 30%, #FDEECB 65%, #FFF3D1 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: none;
      margin-bottom: 1.2rem;
      word-break: keep-all;
      animation: textFlickerGlow 2.8s infinite alternate, subtleScale 3s infinite alternate;
      transform-origin: center;
    }

    @keyframes textFlickerGlow {
      0% {
        filter: drop-shadow(0 0 3px rgba(255, 215, 100, 0.3));
        letter-spacing: 0.02em;
      }

      100% {
        filter: drop-shadow(0 0 15px rgba(255, 200, 80, 0.7)) drop-shadow(0 0 4px #ffd966);
        letter-spacing: 0.03em;
      }
    }

    @keyframes subtleScale {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.01);
      }
    }

    /* decorative ornaments with flow */
    .ornament {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin: 1.2rem 0 0.8rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .line {
      width: 70px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e7c77b, #f3da9b, #e7c77b, transparent);
      border-radius: 2px;
      animation: lineBreathing 2.5s infinite alternate;
    }

    @keyframes lineBreathing {
      0% {
        width: 50px;
        opacity: 0.5;
      }

      100% {
        width: 90px;
        opacity: 1;
        background: linear-gradient(90deg, transparent, #ffeaab, #ffdd88, #ffeaab, transparent);
      }
    }

    .star {
      font-size: 1.3rem;
      letter-spacing: 6px;
      color: #f2da9c;
      text-shadow: 0 0 5px #ffbe3c;
      animation: starSpin 3s infinite alternate;
      display: inline-block;
    }

    @keyframes starSpin {
      0% {
        transform: rotate(0deg) scale(1);
        text-shadow: 0 0 2px gold;
      }

      100% {
        transform: rotate(8deg) scale(1.1);
        text-shadow: 0 0 12px #ffbf40;
      }
    }

    /* sub motto animated underline and shimmer */
    .sub-motto {
      font-family: system-ui, 'Segoe UI', 'Garamond', serif;
      font-size: 0.9rem;
      letter-spacing: 4px;
      word-spacing: 8px;
      color: #e6d5a5;
      text-transform: uppercase;
      font-weight: 400;
      background: rgba(0, 0, 0, 0.35);
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      margin-top: 1rem;
      animation: mottoPulse 2s infinite alternate;
      border: 1px solid rgba(218, 178, 80, 0.5);
    }

    @keyframes mottoPulse {
      0% {
        background: rgba(0, 0, 0, 0.2);
        color: #e0cb93;
        box-shadow: 0 0 0px rgba(230, 190, 70, 0);
      }

      100% {
        background: rgba(0, 0, 0, 0.5);
        color: #ffefb9;
        box-shadow: 0 0 12px rgba(230, 180, 50, 0.4);
      }
    }

    /* floating particles (dynamic animated stars) */
    .floating-particle {
      position: absolute;
      background: radial-gradient(circle, #ffdd99, #f7bc45);
      border-radius: 50%;
      opacity: 0;
      filter: blur(0.6px);
      pointer-events: none;
      z-index: 5;
      animation: particleRise 9s infinite linear;
    }

    @keyframes particleRise {
      0% {
        transform: translateY(0) translateX(0) scale(0.2);
        opacity: 0;
      }

      15% {
        opacity: 0.7;
      }

      80% {
        opacity: 0.8;
        transform: translateY(-90px) translateX(12px) scale(1);
      }

      100% {
        transform: translateY(-150px) translateX(20px) scale(0.2);
        opacity: 0;
      }
    }

    /* additional shimmer overlay on the card */
    .shimmer-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 3rem;
      background: linear-gradient(115deg,
          rgba(255, 245, 200, 0) 10%,
          rgba(255, 245, 180, 0.12) 40%,
          rgba(255, 245, 180, 0) 70%);
      pointer-events: none;
      animation: shimmerMove 6s infinite;
      z-index: 2;
    }

    @keyframes shimmerMove {
      0% {
        transform: translateX(-100%) skewX(-12deg);
      }

      30% {
        transform: translateX(20%) skewX(-12deg);
      }

      100% {
        transform: translateX(200%) skewX(-12deg);
      }
    }

    /* responsiveness */
    @media (max-width: 640px) {
      .name-shrine {
        padding: 2rem 1rem;
      }

      .line {
        width: 40px;
      }

      @keyframes lineBreathing {
        0% {
          width: 30px;
        }

        100% {
          width: 55px;
        }
      }

      .sub-motto {
        font-size: 0.7rem;
        letter-spacing: 2px;
      }
    }

    /* new animated border ripple effect */
    @keyframes borderRipple {
      0% {
        box-shadow: 0 0 0 0 rgba(230, 200, 70, 0.2), 0 0 0 0 rgba(210, 180, 70, 0.1);
      }

      50% {
        box-shadow: 0 0 0 3px rgba(230, 200, 70, 0.2), 0 0 0 8px rgba(210, 180, 70, 0.05);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(230, 200, 70, 0), 0 0 0 0 rgba(210, 180, 70, 0);
      }
    }

    .name-shrine {
      animation: cardGlowPulse 4s infinite alternate, floatCard 6s infinite ease-in-out, borderRipple 3s infinite;
    }

    /* text stroke with gentle animation */
    .glory-text {
      position: relative;
    }
  </style>
</head>

<body>

  <div class="bg-orb"></div>
  <div class="bg-orb-2"></div>
  <div class="bg-orb-3"></div>

  <div class="name-shrine">
    <div class="shimmer-overlay"></div>
    <div class="ornament">
      <span class="line"></span>
      <span class="star">✦ ✧ ✦</span>
      <span class="line"></span>
    </div>

    <div class="glory-text">
      MULA CHINNA<br>
      RANGA SWAMI<br>
      REDDY
    </div>

    <div class="ornament" style="margin-top: 0.6rem;">
      <span class="line" style="width: 50px; animation: lineBreathing 2.2s infinite alternate;"></span>
      <span style="font-size: 0.9rem; color: #e8cf92; font-weight: 300; animation: softPulse 2s infinite;">If you win,
        you need not have to explain...If you lose, you should not be there to explain!</span>
      <span class="line" style="width: 50px; animation: lineBreathing 2.2s infinite alternate;"></span>
    </div>

  </div>

  <script>
    // Create dynamic animated floating particles (enhanced + interactive)
    (function createDynamicParticles() {
      const particleCount = 85;
      const bodyEl = document.body;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.classList.add('floating-particle');
        const size = Math.random() * 5 + 2;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${Math.random() * 100}%`;
        particle.style.bottom = `-${Math.random() * 20}px`;
        particle.style.animationDelay = `${Math.random() * 15}s`;
        particle.style.animationDuration = `${6 + Math.random() * 12}s`;
        particle.style.background = `radial-gradient(circle, #ffdd99, #e5a233)`;
        particle.style.opacity = `${0.3 + Math.random() * 0.6}`;
        bodyEl.appendChild(particle);
      }

      // second class of larger drifting sparkles
      for (let i = 0; i < 40; i++) {
        const spark = document.createElement('div');
        spark.classList.add('floating-particle');
        const sz = Math.random() * 4 + 1.5;
        spark.style.width = `${sz}px`;
        spark.style.height = `${sz}px`;
        spark.style.left = `${Math.random() * 100}%`;
        spark.style.bottom = `${Math.random() * 100}%`;
        spark.style.animationDuration = `${7 + Math.random() * 14}s`;
        spark.style.animationDelay = `${Math.random() * 10}s`;
        spark.style.background = `radial-gradient(circle, #ffefb0, #f7c56e)`;
        spark.style.filter = `blur(0.7px)`;
        bodyEl.appendChild(spark);
      }
    })();

    // Additional micro interaction: on mousemove, a tiny reactive light tilt? (optional smooth effect)
    // but keep it graceful, also rotate name-shrine slightly on mouse move for immersive feel
    const card = document.querySelector('.name-shrine');
    if (card) {
      document.body.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 70;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 70;
        card.style.transform = `perspective(800px) rotateY(${xAxis * 0.5}deg) rotateX(${yAxis * -0.3}deg) translateY(-3px)`;
        setTimeout(() => {
          card.style.transform = '';
        }, 300);
      });
    }

    // subtle animation of letters (fancy css only but minor dynamic JS to reset after hover?)
    window.addEventListener('load', () => {
      console.log("⚜️ MULA CHINNA RANGA SWAMI REDDY | animated tribute ⚜️");
      const glory = document.querySelector('.glory-text');
      if (glory) {
        glory.style.animation = 'textFlickerGlow 2.4s infinite alternate, subtleScale 3s infinite alternate';
      }
    });

    // continuous ripple-like creation: also add occasional floating symbol
    setInterval(() => {
      const extraOrnament = document.createElement('div');
      extraOrnament.innerText = '✦';
      extraOrnament.style.position = 'fixed';
      extraOrnament.style.left = `${Math.random() * 90}%`;
      extraOrnament.style.bottom = `-20px`;
      extraOrnament.style.fontSize = `${Math.random() * 18 + 8}px`;
      extraOrnament.style.color = `rgba(255, 210, 100, ${Math.random() * 0.6 + 0.2})`;
      extraOrnament.style.pointerEvents = 'none';
      extraOrnament.style.zIndex = '999';
      extraOrnament.style.opacity = '0.7';
      extraOrnament.style.filter = 'blur(0.2px)';
      extraOrnament.style.animation = `floatParticleUp 7s linear forwards`;
      document.body.appendChild(extraOrnament);
      setTimeout(() => extraOrnament.remove(), 7000);
    }, 800);

    // custom keyframes for floating stars from bottom
    const styleSheet = document.createElement("style");
    styleSheet.textContent = `
    @keyframes floatParticleUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.2; }
      20% { opacity: 0.8; }
      80% { opacity: 0.9; transform: translateY(-70vh) rotate(20deg);}
      100% { transform: translateY(-100vh) rotate(30deg); opacity: 0; }
    }
  `;
    document.head.appendChild(styleSheet);

    // slight glow pulsing on the name via dynamic text shadow (adds class)
    setInterval(() => {
      const titleDiv = document.querySelector('.glory-text');
      if (titleDiv) {
        titleDiv.style.transition = 'filter 0.3s';
      }
    }, 500);
  </script>

  <style>
    /* Ensure particles are not intrusive */
    .floating-particle {
      position: absolute;
      background: radial-gradient(circle, rgba(245, 200, 100, 0.7), rgba(210, 150, 40, 0.4));
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }

    body {
      overflow: hidden;
      overflow-y: auto;
    }

    /* subtle text transition for glory text */
    .glory-text {
      transition: all 0.1s ease;
    }

    /* add responsive spacing for smaller devices */
    @media (max-width: 550px) {
      .name-shrine {
        padding: 1.5rem;
      }

      .sub-motto {
        font-size: 0.6rem;
        letter-spacing: 2px;
      }

      .star {
        font-size: 0.9rem;
        letter-spacing: 3px;
      }
    }

    /* custom scrollbar to match aesthetic */
    ::-webkit-scrollbar {
      width: 5px;
      background: #11161f;
    }

    ::-webkit-scrollbar-thumb {
      background: #c9ad6a;
      border-radius: 10px;
    }
  </style>
</body>

</html>
